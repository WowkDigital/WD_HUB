<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WD HUB | Wowk Digital Projects</title>
    <meta name="description" content="Central hub for open-source projects and tools created by Wowk Digital.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="text-gray-200 selection:bg-primary/30">

    <!-- Background Elements -->
    <div class="bg-glow"></div>
    <div class="bg-pattern"></div>
    <div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/20 rounded-full blur-[120px] animate-pulse-slow"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-accent/20 rounded-full blur-[120px] animate-pulse-slow"></div>

    <div class="flex-grow flex flex-col items-center py-12 px-4">
        <header class="text-center mb-16 space-y-4 max-w-2xl px-4">
            <div class="inline-block glass px-4 py-1.5 rounded-full text-sm font-medium border-primary/20 text-primary mb-2">
                Wowk Digital Ecosystem
            </div>
            <h1 class="text-5xl md:text-7xl font-bold tracking-tight">
                WD <span class="text-gradient">HUB</span>
            </h1>
            <p class="text-gray-400 text-lg md:text-xl font-light">
                Experimental tools, libraries, and projects. <br class="hidden md:block"> All my work in one central location.
            </p>
        </header>

        <!-- Toolbar: Search & View Selector -->
        <div class="w-full max-w-7xl mb-10 px-4 flex flex-col sm:flex-row justify-between items-center gap-4 z-10">
            <!-- Search bar -->
            <div class="relative w-full sm:max-w-md group">
                <div class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400 group-focus-within:text-primary transition-colors duration-300">
                    <i data-lucide="search" class="w-5 h-5"></i>
                </div>
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Search apps..." 
                    class="w-full pl-12 pr-10 py-3 bg-white/3 backdrop-blur-md border border-white/5 rounded-2xl text-white placeholder-gray-500 focus:outline-none focus:border-primary/40 focus:ring-1 focus:ring-primary/40 transition-all duration-300 text-sm shadow-inner"
                />
                <button 
                    id="search-clear" 
                    class="absolute inset-y-0 right-0 flex items-center pr-4 text-gray-400 hover:text-white transition-colors hidden"
                >
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            
            <!-- View Mode Switcher -->
            <div class="flex items-center bg-white/3 backdrop-blur-md p-1.5 rounded-2xl border border-white/5">
                <button 
                    id="view-featured" 
                    class="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-300 bg-primary text-white shadow-lg shadow-primary/25 border border-primary/20"
                    title="Featured grid layout"
                >
                    <i data-lucide="grid" class="w-4 h-4"></i>
                    <span>Featured</span>
                </button>
                <button 
                    id="view-az" 
                    class="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-300 text-gray-400 hover:text-white border border-transparent"
                    title="Alphabetical list/gallery layout"
                >
                    <i data-lucide="arrow-up-a-z" class="w-4 h-4"></i>
                    <span>A-Z Gallery</span>
                </button>
            </div>
        </div>

        <main id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 w-full max-w-7xl mb-20 px-4">
            <!-- Projects will be rendered here by JavaScript -->
        </main>
    </div>

    <!-- Project Details Modal -->
    <div id="project-modal" class="fixed inset-0 z-[100] hidden">
        <div class="absolute inset-0 bg-[#030712]/80 backdrop-blur-md modal-overlay"></div>
        <div class="absolute inset-0 overflow-y-auto pt-20 pb-12 px-4">
            <div class="max-w-4xl mx-auto glass rounded-[2.5rem] overflow-hidden relative border-white/10 shadow-2xl animate-modal-in">
                <button id="close-modal" class="absolute top-6 right-6 p-3 rounded-2xl bg-white/5 hover:bg-white/10 text-gray-400 hover:text-white transition-all z-10 border border-white/5 hover:border-white/10">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
                
                <div id="modal-content">
                    <!-- Dynamic Content -->
                </div>
            </div>
        </div>
    </div>

    <!-- External Scripts -->
    <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/WowkDigital/WowkDigitalFooter@latest/wowk-digital-footer.js"></script>

    <!-- App Logic -->
    <script src="js/data.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
